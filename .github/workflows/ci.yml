name: CI

# Runs on every push and pull request: the backend's unit tests, a static
# check of the backend's Python, and a build of the website. A red cross on a
# commit means something broke. When a step fails, the end of its output is
# also shown as an annotation on the run, so the reason is visible without
# opening the full log.

on:
  push:
  pull_request:

env:
  # Runs a command, prints its output, and on failure adds the tail of the output as an annotation.
  ANNOTATE: |
    run_annotated() {
      code=0
      out=$("$@" 2>&1) || code=$?
      printf '%s\n' "$out" | tail -n 60
      if [ $code -ne 0 ]; then
        msg=$(printf '%s' "$out" | tail -c 1800 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
        echo "::error title=$1 failed::$msg"
      fi
      return $code
    }

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-gap/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install what the tests need
        run: |
          eval "$ANNOTATE"
          run_annotated pip install fastapi httpx pydantic pandas numpy python-multipart pytest
      - name: Run tests
        run: |
          eval "$ANNOTATE"
          run_annotated python -m pytest -q

  backend-engine:
    # Runs the sample data through the real analysis (the full requirements, so slower).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-gap/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the full requirements
        run: |
          eval "$ANNOTATE"
          run_annotated pip install -r requirements.txt pytest
      - name: Run the engine tests
        run: |
          eval "$ANNOTATE"
          run_annotated python -m pytest -q tests/test_demo_engine.py

  backend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-gap/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the Python for errors
        run: npx --yes pyright

  website-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-gap/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          eval "$ANNOTATE"
          # npm ci refuses the lock file here (it was last saved by a different npm version), so install normally.
          run_annotated npm install --no-audit --no-fund
      - name: Build
        run: |
          eval "$ANNOTATE"
          run_annotated npx next build
